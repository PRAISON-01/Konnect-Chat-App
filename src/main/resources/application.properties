# PostgreSQL Database Connection Configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/konnect_db
spring.datasource.username=konnect_user
spring.datasource.password=my_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Lifecycle Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

